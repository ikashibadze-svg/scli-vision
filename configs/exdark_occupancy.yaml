seed: 20261003
image_size: 64
n_roles: 20
min_role_spacing: 4
patch_radius: 3

# Legacy sign-stability is diagnostic only in model v2.
min_stability: 0.60
max_constraints: 220

# A relation may vote only if its raw magnitude clears both
# estimated readout noise and a fraction of its reference magnitude.
obs_sigma_factor: 2.0
obs_reference_fraction: 0.08

target_known_accuracy: 0.90
min_known_coverage: 0.05

conditions:
  - normal
  - contrast_10
  - contrast_03
  - dark_15
  - blur
  - noise_08
  - occlusion_25
  - lowlight_combo

# v6 robust gate calibration uses transformed VALIDATION images only.
# This is not test leakage: the same declared corruption families are
# applied to held-out validation instances to certify selective behavior.
calibration_conditions:
  - normal
  - contrast_10
  - contrast_03
  - dark_15
  - blur
  - noise_08
  - occlusion_25
  - lowlight_combo

# A regime is allowed to be ignored by certification only if the model
# answers on less than this fraction of that regime.
min_group_answer_rate: 0.02
